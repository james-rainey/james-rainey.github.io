# Local preview: `docker compose up`, then open http://localhost:8080
# Gems are cached in a named volume, so only the first start is slow.
services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv
    command: >
      bash -c "command -v node >/dev/null || (apt-get update -qq && apt-get install -y -qq imagemagick nodejs >/dev/null);
               bundle install --quiet &&
               bundle exec jekyll serve --host 0.0.0.0 --port 8080 --livereload --force_polling"
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv
      - gems:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development

volumes:
  gems:
