# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: James
middle_name:
last_name: Rainey
description: >
  James Rainey builds technology for trusted digital media with the JPEG Trust
  standard, alongside AI for algal bloom monitoring and retinal imaging.
keywords: trusted digital media, JPEG Trust, media provenance, computer vision, remote sensing, algal blooms, medical imaging, retinal imaging
lang: en
icon: jr-detection-green.svg # the favicon: an emoji, or an image name in /assets/img/
logo: jr-detection-green.svg # the header logo, an image name in /assets/img/; leave blank to show initials

url: https://jamesrainey.co.uk # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/. Leave blank for root

# Contact form (_pages/contact.md). Create a form at https://formspree.io,
# set it to deliver to your personal email, and paste its endpoint here.
# Leave blank to hide the form.
contact_form_endpoint: https://formspree.io/f/xzergzrr

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image: https://jamesrainey.co.uk/assets/img/james.png

# Search engine verification (optional)
enable_google_verification: false
enable_bing_verification: false
google_site_verification:
bing_site_verification:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    output: false # news items are short and shown inline on the home page
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "assets"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-terser
  - jemoji

sass:
  style: compressed

jekyll-minifier:
  compress_css: false # Sass already compresses; the minifier breaks clamp() maths
  compress_javascript: false # terser handles JS
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Rainey]
  first_name: [James]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  query: "@*"
  group_by: year
  group_order: descending

# Fields used internally by the site, hidden from the BibTeX shown to visitors
filtered_bibtex_keywords: [abbr, abstract, code, pdf, project, selected, website]

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-quality 85"

lazy_loading_images: true

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_medium_zoom: true # click-to-zoom on images in project write-ups
enable_math: true # pages opt in with `math: true` in their front matter

# -----------------------------------------------------------------------------
# Third-party libraries
# -----------------------------------------------------------------------------

third_party_libraries:
  download: false
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
  mathjax:
    integrity:
      js: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
    local:
      fonts: "output/chtml/fonts/woff-v2/"
    url:
      fonts: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/output/chtml/fonts/woff-v2/"
      js: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
    version: "3.2.2"
  formspree_ajax:
    integrity:
      js: "sha256-NRTy7NVDMldoedsXAVvUPE7ADGMiUzbsbAc/ftHinGc="
    url:
      js: "https://cdn.jsdelivr.net/npm/@formspree/ajax@1.1.5/dist/global.js"
    version: "1.1.5"
  medium_zoom:
    integrity:
      js: "sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc="
    url:
      js: "https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"
    version: "1.1.0"

# -----------------------------------------------------------------------------
# CV data
# -----------------------------------------------------------------------------

jekyll_get_json:
  - data: resume
    json: assets/json/resume.json
